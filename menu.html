<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index,follow"/>
    <Meta name=”description”   content="sweet,ice cream"/>
    <Meta name="author"  content="natia kasaburi" />
    <Meta name =”keywords” content="delicious,Outstanding,ice cream"/>
    <Meta property="og:title" content="sweet ice cream"/>
    <Meta property="og:description" content="ice cream"/>
    <Meta property="og:type" content="website"/>
    <title>ice cream</title>
    <link rel="stylesheet" href="./menu.css">
</head>
<body>
    <main>
        <div class="content">
            <div class="box">
                <div class="content2">
                    <h1>Filter & Sort</h1>
                    <p>(6 products)</p>
                </div>
                <div class="content3">
                    <a href="./shop.html">home</a>
                </div>
            </div>
            <div class="box2">
                <form action class="myselect">
                    <select action id="myselect">
                        <option value="by name" >Sort by:Name  Z-A</option>
                        <option value="Recommended">Recommended</option>
                        <option value="Newest">Newest</option>
                        <option value="price">Price (low to high)</option>
                        <option value="price">Price (high to low)</option>
                        <option value="name">Name A-Z</option>
                        <option value="name">Name Z-A</option>
                    </select>
                </form>
                <p class="w">+</p>
            </div>
            <div class="price">
                <p class="pricee">Price ($8 - $12)</p>
                <div class="price1">
                    <button onclick="toggleinput()" class="price1">-</button>
                    <form>
                        <input type="range" name="range" required id="myinput">
                    </form>
                </div>
            </div>
            <div class="scoop">
                <button class="m">+</button>
                    <form action>
                        <select name="select" id="select" class="select">
                            <option>Scoop Size</option>
                            <option>Double Scoop</option>
                            <option>Single Scoop</option>
                        </select>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <script>
        function toggleinput(){
            const  input=document.getElementById("myinput");
            input.classList.toggle("show");
        }
    </script>
</body>
</html>
